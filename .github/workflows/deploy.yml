name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "=== Secret 주입 확인 ==="
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_URL secret이 비어 있습니다!"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_ANON_KEY secret이 비어 있습니다!"
            exit 1
          fi
          echo "SUPABASE_URL 길이: ${#SUPABASE_URL}자"
          echo "SUPABASE_ANON_KEY 길이: ${#SUPABASE_ANON_KEY}자"

          sed -i "s|YOUR_SUPABASE_URL|$SUPABASE_URL|g" index.html
          sed -i "s|YOUR_SUPABASE_ANON_KEY|$SUPABASE_ANON_KEY|g" index.html

          if grep -q "YOUR_SUPABASE_URL" index.html; then
            echo "ERROR: URL 치환 실패"
            exit 1
          fi
          echo "=== 주입 완료 ==="

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
